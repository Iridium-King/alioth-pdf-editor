name: Construir macOS
on:
  workflow_dispatch:
  push:
    branches: [codex/macos-3.2.53]
permissions:
  contents: read
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Instalar dependencias de macOS
        run: python -m pip install -r HERRAMIENTAS_DEV/requirements-macos.txt
      - name: Construir aplicación nativa
        run: python build_macos.py
      - name: Verificar integración sin abrir la interfaz
        run: |
          python -m unittest discover -s HERRAMIENTAS_DEV/tests -p test_macos_integration.py
          "RELEASE/macOS/Alioth PDF Editor.app/Contents/MacOS/AliothPDF" --version
          codesign --verify --deep --strict "RELEASE/macOS/Alioth PDF Editor.app"
      - name: Empaquetar aplicación conservando permisos y enlaces
        run: ditto -c -k --sequesterRsrc --keepParent "RELEASE/macOS/Alioth PDF Editor.app" "RELEASE/macOS/Alioth-PDF-macOS-3.2.53-${RUNNER_ARCH}.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Alioth-PDF-macOS-${{ runner.arch }}
          path: RELEASE/macOS/*.zip
          if-no-files-found: error
          retention-days: 30
